<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerim Musci+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0e14;
            background-image: radial-gradient(circle at 20% 30%, #14212b 0%, #030507 100%);
            padding: 1.5rem;
            gap: 2.5rem;
        }

        h1 {
            color: #e6f2ff;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 5px rgba(0, 20, 40, 0.7);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.9rem;
            background: linear-gradient(135deg, #0b2c4a, #03101e);
            border: 2px solid #1b7ad0;
            border-radius: 100px;
            padding: 1rem 3.5rem;
            font-size: 2rem;
            font-weight: 700;
            color: #f0f9ff;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 10px 0 #02101d, 0 10px 25px rgba(0, 40, 80, 0.8);
            transition: all 0.08s linear;
            text-shadow: 0 2px 3px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .download-btn::before {
            content: "⬇";
            font-size: 2.2rem;
            line-height: 1;
            color: #6db2ff;
            filter: drop-shadow(0 2px 3px #001c33);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 0 #02101d, 0 18px 35px rgba(0, 60, 130, 0.9);
            background: linear-gradient(135deg, #123a5a, #041826);
            border-color: #3a94f0;
        }

        .download-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #02101d, 0 10px 20px rgba(0, 20, 50, 0.8);
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 2.5rem;
            }
            .download-btn {
                font-size: 1.5rem;
                padding: 0.9rem 2rem;
            }
            .download-btn::before {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <h1>Kerim Musci+</h1>
    <a href="https://apk.e-droid.net/apk/app3346530-epq9vc.apk?v=29" 
       class="download-btn" 
       download
       target="_blank"
       rel="noopener noreferrer">
        Descargar
    </a>
</body>
</html>
